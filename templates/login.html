<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Diário de Fretamento</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="d-flex align-items-center" style="min-height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-8 col-md-6 col-lg-4">
                <div class="card shadow-sm p-2">
                    <div class="card-body">
                        <h3 class="card-title text-center mb-4 fw-bold text-dark">Diário de Bordo</h3>
                        
                        {% with messages = get_flashed_messages() %}
                            {% if messages %}
                                {% for m in messages %}
                                    <div class="alert alert-danger p-2 text-center small">{{ m }}</div>
                                {% endfor %}
                            {% endif %}
                        {% endwith %}

                        <form method="POST">
                            <div class="mb-3">
                                <label class="form-label fw-medium">Usuário</label>
                                <input type="text" name="usuario" class="form-control form-control-lg" placeholder="Ex: luciano" required autocomplete="off">
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-medium">Senha</label>
                                <input type="password" name="senha" class="form-control form-control-lg" placeholder="••••" required>
                            </div>
                            <button type="submit" class="btn btn-primary btn-lg w-100">Entrar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
